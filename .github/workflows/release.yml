name: Build desktop apps

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to build
# Flow for macOS + Windows and attach the installers to a GitHub Release.
# "Run workflow" on the Actions tab builds the same files as downloadable
# artifacts without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-latest }
          - { name: macOS Intel,         os: macos-15-intel }
          - { name: Windows,             os: windows-latest }
    env:
      FLOW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Run tests
        run: python tests.py

      - name: Build app
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: Flow-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/Flow-macOS-*.dmg
            dist/Flow-Windows-*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
